<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>鹅鸭杀 · 全员卷宗</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap');

:root {
  --paper: #f5f0e8;
  --cream: #faf7f0;
  --wine: #4a1525;
  --wine-dark: #2d0a14;
  --wine-mid: #6b2a3a;
  --ink: #1a1410;
  --ink-light: #3d3028;
  --gold: #c9a96e;
  --gold-bright: #d4b87a;
  --gold-dim: #a0854a;
  --red-warn: #8b2a3a;
  --shadow: rgba(45,10,20,0.25);
  --serif: 'Playfair Display', 'Crimson Text', 'Noto Serif SC', serif;
  --sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden;
  font-family:var(--sans); background:#0d0508;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  touch-action:pan-y; user-select:none; -webkit-user-select:none;
}
body::after {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:9999; opacity:0.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  background-size:200px 200px;
}

#app { width:100%; height:100%; position:relative; overflow:hidden; }

/* ── Page base ── */
.page {
  position:absolute; inset:0; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
  transition:transform 0.55s cubic-bezier(0.4,0,0.2,1);
  will-change:transform;
}
.page::-webkit-scrollbar { display:none; }
.page.active  { transform:translateY(0);    z-index:10; }
.page.before  { transform:translateY(-100%); z-index:5; }
.page.after   { transform:translateY(100%);  z-index:5; }

/* ── Page Inner ── */
.pg {
  position:relative; min-height:100%; padding:24px 16px 48px;
  border:1px solid var(--gold); margin:8px;
  background:var(--paper);
}
.pg::after {
  content:''; position:absolute; top:5px; left:5px; right:5px; bottom:5px;
  border:0.5px solid rgba(201,169,110,0.35); pointer-events:none;
}
.pg .corner { position:absolute; width:16px; height:16px; opacity:0.25; }
.pg .corner.tl { top:10px; left:10px; border-top:1px solid var(--gold); border-left:1px solid var(--gold); }
.pg .corner.tr { top:10px; right:10px; border-top:1px solid var(--gold); border-right:1px solid var(--gold); }
.pg .corner.bl { bottom:10px; left:10px; border-bottom:1px solid var(--gold); border-left:1px solid var(--gold); }
.pg .corner.br { bottom:10px; right:10px; border-bottom:1px solid var(--gold); border-right:1px solid var(--gold); }

/* backgrounds */
.bg-cream .pg { background:var(--cream); }
.bg-wine .pg { background:var(--wine); color:var(--cream); }
.bg-wine .pg .text-body { color:#d4c5b0; }
.bg-dia .pg { background:linear-gradient(135deg, var(--cream) 52%, var(--wine) 52%); }
.bg-dark .pg { background:var(--wine-dark); color:var(--cream); }
.bg-mid  .pg { background:var(--wine-mid); color:var(--cream); }

/* ── Typography ── */
.t-xl { font-family:var(--serif); font-size:clamp(2rem,5vw,3.2rem); font-weight:900; line-height:1.2; text-align:center; }
.t-lg { font-family:var(--serif); font-size:clamp(1.4rem,3.5vw,2rem); font-weight:700; line-height:1.3; text-align:center; }
.t-md { font-family:var(--serif); font-size:1.15rem; font-weight:700; }
.t-sm { font-family:var(--serif); font-size:1rem; font-weight:700; }
.t-body { font-size:0.92rem; line-height:1.85; color:var(--ink-light); }
.t-cap { font-size:0.75rem; color:var(--gold-dim); text-align:center; letter-spacing:2px; text-transform:uppercase; }
.t-hint { font-size:0.72rem; color:rgba(201,169,110,0.8); text-align:center; }

.gold-line { width:50px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:10px auto; }
.gold-line.l { margin-left:0; }
.gold-div  { width:100%; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:14px 0; }

/* ── Wax Seal ── */
.seal { width:44px; height:44px; border-radius:50%; margin:0 auto;
  background:radial-gradient(circle at 40% 38%, #c0392b, #5e1010);
  box-shadow:0 2px 8px rgba(0,0,0,0.35), inset 0 1px 2px rgba(255,255,255,0.12);
  display:flex; align-items:center; justify-content:center; font-size:16px; color:rgba(212,184,122,0.5); }
.seal.lg { width:66px; height:66px; font-size:24px; }

/* ── Cards ── */
.card {
  background:rgba(255,255,255,0.75); border:0.5px solid rgba(201,169,110,0.5);
  border-radius:1px; padding:14px; margin:10px 0; position:relative;
  box-shadow:0 2px 10px rgba(45,10,20,0.12); transition:all 0.3s;
}
.card:active { transform:translateY(2px); box-shadow:0 1px 4px rgba(45,10,20,0.15); }
.card-wine { background:rgba(74,21,37,0.92); color:var(--cream); border-color:rgba(201,169,110,0.4); }
.card-wine .t-body { color:rgba(245,240,232,0.8); }
.card-neut { background:linear-gradient(135deg, rgba(250,247,240,0.95) 55%, rgba(74,21,37,0.85) 55%); color:var(--cream); }
.card-neut .t-body { color:rgba(245,240,232,0.85); }
.card-fold { position:absolute; top:0; right:0; width:20px; height:20px;
  background:linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.06) 50%); }
.card-left-red { border-left:3px solid var(--red-warn); }

.tag { display:inline-block; padding:2px 10px; font-size:0.68rem; font-family:var(--serif);
  border:0.5px solid var(--gold); letter-spacing:1px; }
.tag-g { background:var(--cream); color:var(--wine); }
.tag-d { background:var(--wine); color:var(--cream); }
.tag-n { background:var(--gold-dim); color:var(--cream); }

.stars { color:var(--gold); font-size:0.8rem; letter-spacing:3px; }

/* ── Buttons ── */
.btn {
  display:inline-block; padding:10px 22px; border:1px solid var(--gold);
  font-family:var(--serif); font-size:0.85rem; cursor:pointer; text-align:center;
  transition:all 0.25s; background:transparent; border-radius:1px;
}
.btn:active { transform:translateY(2px); border-color:var(--gold-bright); box-shadow:0 0 10px rgba(201,169,110,0.25); }
.btn-cream { background:var(--cream); color:var(--wine); }
.btn-wine  { background:var(--wine); color:var(--cream); }
.btn-sm { padding:6px 14px; font-size:0.7rem; }

/* ── Split layout ── */
.split { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.split-col { padding:14px; border:0.5px solid rgba(201,169,110,0.3); }
.split-col.l { background:rgba(255,255,255,0.6); }
.split-col.r { background:rgba(74,21,37,0.06); }

/* ── Timeline ── */
.tl { position:relative; padding-left:30px; }
.tl::before { content:''; position:absolute; left:11px; top:0; bottom:0; width:1px;
  background:linear-gradient(180deg, var(--gold), var(--gold-dim), var(--gold)); }
.tl-node { position:relative; margin-bottom:16px; padding:10px 14px;
  background:rgba(255,255,255,0.55); border:0.5px solid rgba(201,169,110,0.25);
  border-radius:1px; transition:background 0.3s; }
.tl-node:active { background:rgba(201,169,110,0.1); }
.tl-node::before { content:''; position:absolute; left:-23px; top:14px;
  width:7px; height:7px; border:1px solid var(--gold); border-radius:50%; background:var(--cream); }

/* ── Swiper ── */
.swiper { display:flex; overflow-x:auto; scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch; gap:10px; padding:8px 0; scrollbar-width:none; }
.swiper::-webkit-scrollbar { display:none; }
.swiper-card { flex:0 0 88%; scroll-snap-align:center; min-width:270px; }

/* ── Character Avatar ── */
.c-av { width:100px; height:100px; border-radius:50%; border:2px solid var(--gold);
  display:flex; align-items:center; justify-content:center; font-size:2.6rem;
  background:rgba(201,169,110,0.08); margin:0 auto 8px; }
.c-av.goose { background:linear-gradient(135deg, #faf7f0, #e8dcc8); }
.c-av.duck { background:linear-gradient(135deg, #3d101d, #1d060c); }
.c-av.neut { background:linear-gradient(135deg, #b8943d, #6d4f1a); }

/* ── Quick Ref Grid ── */
.qgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(105px,1fr)); gap:6px; }
.qcard { padding:8px 4px; text-align:center; cursor:pointer; border:0.5px solid rgba(201,169,110,0.35);
  border-radius:1px; transition:all 0.3s; }
.qcard:active { transform:scale(0.96); border-color:var(--gold-bright); }
.qcard.goose { background:rgba(255,255,255,0.7); }
.qcard.duck { background:rgba(74,21,37,0.85); color:var(--cream); }
.qcard.neut { background:linear-gradient(180deg, rgba(255,255,255,0.6), rgba(74,21,37,0.5)); color:var(--cream); }

/* ── Animations ── */
@keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeIn  { from { opacity:0; } to { opacity:1; } }
@keyframes shimmer { 0% { background-position:-200% 0; } 100% { background-position:200% 0; } }
@keyframes pulse   { 0%,100% { opacity:0.5; } 50% { opacity:1; } }
@keyframes glow    { 0%,100% { border-color:var(--gold); } 50% { border-color:var(--gold-bright); } }
.a-fade { animation:fadeUp 0.7s ease forwards; opacity:0; }
.a-d1 { animation-delay:0.15s; } .a-d2 { animation-delay:0.35s; } .a-d3 { animation-delay:0.55s; } .a-d4 { animation-delay:0.75s; }

/* ── Bottom bar ── */
.bbar { position:fixed; bottom:10px; right:10px; z-index:100;
  font-family:var(--serif); font-size:0.68rem; color:var(--gold);
  background:rgba(0,0,0,0.55); padding:3px 10px; border-radius:10px;
  border:0.5px solid rgba(201,169,110,0.4); pointer-events:none; }

/* ── Highlight marks ── */
.hl { background:linear-gradient(180deg, transparent 60%, rgba(201,169,110,0.22) 60%); }
.hl-r { background:linear-gradient(180deg, transparent 60%, rgba(200,45,45,0.18) 60%); }

/* ── Bottom decoration ── */
.bot-dec { width:100%; height:14px; margin-top:14px;
  background:repeating-linear-gradient(90deg, transparent, transparent 6px, rgba(201,169,110,0.35) 6px, rgba(201,169,110,0.35) 7px); }

/* ── Link strip ── */
.link-strip { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:6px 0; }

/* Scroll hint */
.scroll-hint { text-align:center; padding:6px; animation:pulse 2.2s infinite; font-size:0.7rem; color:var(--gold-dim); }
</style>
</head>

// ═══════════════════ HELPERS ═══════════════════
function H(tag, cls, html, attrs='') {
  return `<${tag} class="${cls}" ${attrs}>${html}</${tag}>`;
}

function page(id, bg, inner) {

    <div class="pg"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    ${inner}</div></div>`;
}

function seal(lg) { return H('div','seal'+(lg?' lg':''),'⚜'); }

function card(cls, html, onclick) {
  return H('div','card'+(cls?' '+cls:''),

    onclick ? `onclick="${onclick}" style="cursor:pointer"` : '');
}

// ═══════════════════ APP LOGIC ═══════════════════
let cur = 1, curFac = 'goose', tY = 0, tX = 0, total = 20;

function init() {
  let html = '';
  html += P1(); html += P2(); html += P3(); html += P4(); html += P5();
  html += P6(); html += P7(); html += P8();
  for (let i=9;i<=13;i++) html += PChar(i);
  html += P14(); html += P15(); html += P16(); html += P17(); html += P18();
  html += P19(); html += P20();
  document.getElementById('app').innerHTML = html;

  // Set initial page state
  document.querySelectorAll('.page').forEach((p,i) => {
    if (i===0) p.className = 'page active';
    else p.className = 'page after';
  });

  populateChars();
  populateQuickRef();
  updateP8('goose');
  updateIndicator();

  // Animation for P1
  requestAnimationFrame(() => {
    document.querySelectorAll('#p1 .a-fade').forEach(el => el.style.opacity = '');
  });

  // Long press for P2
  bindLongPress('p2left', 'rgba(255,255,255,0.85)', '0 0 25px rgba(255,255,255,0.6)');
  bindLongPress('p2right', 'rgba(74,21,37,0.45)', '0 0 25px rgba(200,40,40,0.3)');
}

function bindLongPress(id, bg, shadow) {
  const el = document.getElementById(id);
  if (!el) return;
  const origBg = el.style.background;
  const origSh = el.style.boxShadow;
  ['mousedown','touchstart'].forEach(ev => el.addEventListener(ev, e => {
    if (ev.type==='touchstart') e.preventDefault();
    el.style.background = bg; el.style.boxShadow = shadow;
  }));
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev => el.addEventListener(ev, () => {
    el.style.background = origBg; el.style.boxShadow = origSh;
  }));
}

function populateChars() {
  // P9: Goose 0-2
  renderCharGroup(9, CHARS.goose.slice(0,3), '鹅阵营合集详情页', false);
  // P10: Goose 3-7
  renderCharGroup(10, CHARS.goose.slice(3,8), '鹅阵营剩余角色详情页', false);
  // P11: Duck 0-1 (ProKiller, Cannibal)
  renderCharGroup(11, CHARS.duck.slice(0,2), '鸭阵营刺杀组详情页', true);
  // P12: Duck 2-6
  renderCharGroup(12, CHARS.duck.slice(2,7), '鸭阵营功能组详情页', true);
  // P13: All neutral
  renderCharGroup(13, CHARS.neutral, '全中立角色详情页', false);
}

function renderCharGroup(pgNum, chars, title, isDuck) {
  const c = document.getElementById(`p${pgNum}Content`);
  if (!c) return;
  const btnCls = isDuck ? 'btn-cream' : 'btn-cream';
  const titleCol = isDuck ? 'color:var(--cream);' : 'color:var(--wine);';
  c.innerHTML = `
    <button class="btn ${btnCls} btn-sm" onclick="navigateTo(8)" style="margin-bottom:8px;">← 返回目录</button>
    <h2 class="t-lg" style="${titleCol}">${title}</h2><div class="gold-line"></div>
    <div class="swiper" id="swP${pgNum}">${chars.map((ch,i)=>charCard(ch,i,chars.length)).join('')}</div>`;
}

function populateQuickRef() {
  const g = document.getElementById('quickGrid');
  if (!g) return;
  const all = [
    ...CHARS.goose.map(c=>({...c,color:'goose',pg:c===CHARS.goose[0]||c===CHARS.goose[1]||c===CHARS.goose[2]?9:10,idx:CHARS.goose.indexOf(c)})),
    ...CHARS.duck.map(c=>({...c,color:'duck',pg:c===CHARS.duck[0]||c===CHARS.duck[1]?11:12,idx:CHARS.duck.indexOf(c)})),
    ...CHARS.neutral.map(c=>({...c,color:'neut',pg:13,idx:CHARS.neutral.indexOf(c)}))
  ];
  g.innerHTML = all.map(c => `
    <div class="qcard ${c.color}" onclick="navChar('${c.id}')">
      <div style="font-size:1.8rem;">${c.emoji}</div>
      <p style="font-size:0.72rem;font-weight:700;">${c.name}</p>
      <p style="font-size:0.6rem;opacity:0.7;">${c.role}</p>
    </div>`).join('');
}

function updateP8(faction) {
  curFac = faction;
  const list = document.getElementById('p8List');
  const title = document.getElementById('p8Title');
  const pg = document.getElementById('p8');
  if (!list||!title||!pg) return;

  let chars, label;
  if (faction==='goose') { chars=CHARS.goose; label='鹅阵营 · 好人'; pg.className='page active bg-cream'; }
  else if (faction==='duck') { chars=CHARS.duck; label='鸭阵营 · 坏人'; pg.className='page active bg-wine'; }
  else { chars=CHARS.neutral; label='中立阵营 · 独行'; pg.className='page active bg-cream'; }

  title.textContent = `角色目录 · ${label}`;
  title.style.color = faction==='duck' ? 'var(--cream)' : 'var(--wine)';
  const isD = faction==='duck', isN = faction==='neutral';

  list.innerHTML = chars.map((c,i) => {
    const tPg = faction==='goose' ? (i<3?9:10) : (faction==='duck' ? (i<2?11:12) : 13);
    const cardCls = isD ? 'card-wine' : (isN ? 'card-neut' : '');
    const tCol = isD ? 'color:var(--cream);' : (isN ? 'color:var(--cream);' : 'color:var(--wine);');
    const subCol = isD ? 'color:rgba(255,255,255,0.5);' : (isN ? 'color:rgba(255,255,255,0.65);' : 'color:#888;');
    return `<div class="card ${cardCls}" onclick="navCharPage(${tPg},${i},'${faction}')" style="cursor:pointer;margin:6px 0;">
      <div class="card-fold"></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:1.8rem;">${c.emoji}</span>
        <div style="flex:1;"><h4 style="font-family:var(--serif);${tCol}">${c.name}</h4><div class="stars">${c.stars}</div><p style="font-size:0.7rem;${subCol}">${c.role}</p></div>
        <span style="font-size:0.6rem;color:var(--gold);border:0.5px solid var(--gold);padding:2px 8px;border-radius:8px;">详情 →</span>
      </div></div>`;
  }).join('');
}

function navigateTo(pg, faction) {
  if (pg<1||pg>total||pg===cur) return;
  const oldPg = document.getElementById(`p${cur}`);
  const newPg = document.getElementById(`p${pg}`);
  if (!oldPg||!newPg) return;

  if (pg > cur) { oldPg.className='page before'; newPg.className='page active'; }
  else { oldPg.className='page after'; newPg.className='page active'; }

  setTimeout(() => {
    document.querySelectorAll('.page').forEach(p => {
      const n = parseInt(p.dataset.pg);
      if (n !== pg) { if (n < pg) p.className='page before'; else p.className='page after'; }
    });
  }, 550);

  cur = pg;
  if (pg===8 && faction) updateP8(faction);
  newPg.scrollTop = 0;
  updateIndicator();

  // Animate fade elements on new page
  requestAnimationFrame(() => {
    newPg.querySelectorAll('.a-fade').forEach(el => el.style.opacity = '');
  });
}

function navCharPage(pg, idx, faction) {
  navigateTo(pg);
  setTimeout(() => {
    const sw = document.getElementById(`swP${pg}`);
    if (sw) { const card = sw.querySelector('.swiper-card'); if (card) sw.scrollLeft = idx * (card.clientWidth + 10); }
  }, 650);
}

function navChar(id) {
  for (let i=0;i<CHARS.goose.length;i++) {
    if (CHARS.goose[i].id===id) { navCharPage(i<3?9:10, i<3?i:i-3, 'goose'); return; }
  }
  for (let i=0;i<CHARS.duck.length;i++) {
    if (CHARS.duck[i].id===id) { navCharPage(i<2?11:12, i<2?i:i-2, 'duck'); return; }
  }
  for (let i=0;i<CHARS.neutral.length;i++) {
    if (CHARS.neutral[i].id===id) { navCharPage(13, i, 'neutral'); return; }
  }
}

function resetAll() {
  cur=1;
  document.querySelectorAll('.page').forEach((p,i) => {
    p.className = i===0 ? 'page active' : 'page after';
    p.scrollTop = 0;
  });
  updateIndicator();
}

function updateIndicator() {
  document.getElementById('pgNum').textContent = `${cur} / ${total}`;
}

// ── Touch / Input ──
document.addEventListener('touchstart', e => { tY=e.touches[0].clientY; tX=e.touches[0].clientX; }, {passive:true});

document.addEventListener('touchend', e => {
  const dy = tY - e.changedTouches[0].clientY;
  const dx = tX - e.changedTouches[0].clientX;
  if (Math.abs(dy)>Math.abs(dx) && Math.abs(dy)>40) {
    if (dy>0 && cur<total) navigateTo(cur+1);
    else if (dy<0 && cur>1) navigateTo(cur-1);
  }
});

document.addEventListener('click', e => {
  if (e.target.closest('button')||e.target.closest('[onclick]')||e.target.closest('.card')||e.target.closest('.qcard')) return;
  if (cur===1) navigateTo(2);
});

document.addEventListener('keydown', e => {
  if (e.key==='ArrowDown'||e.key==='ArrowRight') { e.preventDefault(); if (cur<total) navigateTo(cur+1); }
  else if (e.key==='ArrowUp'||e.key==='ArrowLeft') { e.preventDefault(); if (cur>1) navigateTo(cur-1); }
});

// Mouse wheel
document.addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) > 30) {
    if (e.deltaY > 0 && cur < total) navigateTo(cur + 1);
    else if (e.deltaY < 0 && cur > 1) navigateTo(cur - 1);
  }
}, {passive: true});

// Init
init();
console.log('🦢🦆 鹅鸭杀 · 全员卷宗 | 20页全角色互动卷宗');
console.log('📱 移动端竖向滑动翻页 | 🖥️ 桌面端滚轮/键盘方向键翻页');

console.log('🔗 公开网址: https://goose-duck-scroll.surge.sh');
