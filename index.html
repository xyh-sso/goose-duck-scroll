<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>鹅鸭杀 · 全员卷宗</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap');

:root {
  --bg: #1a1a22;
  --bg-card: #252530;
  --red: #c41e3a;
  --red-dark: #8b1530;
  --red-bright: #e8304a;
  --white: #f5f0e8;
  --gray: #999099;
  --gray-light: #c0b8c0;
  --serif: 'Playfair Display', 'Cormorant Garamond', 'Noto Serif SC', serif;
  --serif-sc: 'Noto Serif SC', 'STSong', serif;
  --sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden;
  font-family:var(--sans); background:#0a0406;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  touch-action:pan-y; user-select:none; -webkit-user-select:none;
}

/* ═══════════ GLOBAL PAPER GRAIN OVERLAY ═══════════ */
body::after { display:none; }

#app { width:100%; height:100%; position:relative; overflow:hidden; }

/* ═══════════ PAGE BASE ═══════════ */
.page {
  position:absolute; top:0; left:0; width:100%; height:100%;
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
  transition:transform 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
  will-change:transform; backface-visibility:hidden;
}
.page::-webkit-scrollbar { display:none; }
.page.active  { transform:translateY(0);    z-index:10; }
.page.before  { transform:translateY(-100%); z-index:5; }
.page.after   { transform:translateY(100%);  z-index:5; }

/* ═══════════ PAGE INNER — DARK NOIR ═══════════ */
.pg {
  position:relative; min-height:100%; padding:28px 18px 56px;
  margin:0; border:none;
  background:var(--bg);
  color:var(--white);
  box-shadow:none; border-radius:0;
}
.pg::after { display:none; }
.pg::before { display:none; }

/* ═══════════ CORNERS — RED ACCENT ═══════════ */
.corner { position:absolute; width:24px; height:24px; z-index:2; }
.corner.tl { top:10px; left:10px; border-top:1px solid var(--red); border-left:1px solid var(--red); }
.corner.tr { top:10px; right:10px; border-top:1px solid var(--red); border-right:1px solid var(--red); }
.corner.bl { bottom:10px; left:10px; border-bottom:1px solid var(--red); border-left:1px solid var(--red); }
.corner.br { bottom:10px; right:10px; border-bottom:1px solid var(--red); border-right:1px solid var(--red); }
.corner::after { content:'◆'; position:absolute; font-size:5px; color:var(--red); }
.corner.tl::after { top:-2px; left:-2px; }
.corner.tr::after { top:-2px; right:-2px; }
.corner.bl::after { bottom:-2px; left:-2px; }
.corner.br::after { bottom:-2px; right:-2px; }

/* ═══════════ VIGNETTE EFFECT FOR ATMOSPHERE ═══════════ */
.vignette {
  position:relative;
}
.vignette::after {
  content:''; position:absolute; inset:0; pointer-events:none; z-index:1;
  background:radial-gradient(ellipse at center, transparent 60%, rgba(32,8,14,0.15) 100%);
}

/* ═══════════ DARK PAGES (wine/dark backgrounds) ═══════════ */
.bg-wine .pg {
  background:
    linear-gradient(180deg, #3d0f1a 0%, #2d0a12 40%, #20080e 100%),
    repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,0.015) 3px, rgba(255,255,255,0.015) 4px);
  border-color:rgba(184,148,61,0.5);
  box-shadow:inset 0 0 100px rgba(0,0,0,0.4), 0 4px 30px rgba(0,0,0,0.5);
  color:#000;
}
.bg-wine .pg::after { border-color:rgba(184,148,61,0.5); }
.bg-wine .corner { border-color:var(--gold); }
.bg-wine .corner::after { color:var(--gold); }

/* ═══════════ DIAGONAL COVER PAGE ═══════════ */
.bg-dia .pg {
  background:linear-gradient(135deg, #faf6ec 48%, #f5efe0 48%, #f5efe0 52%, #3d0f1a 52%, #3d0f1a 55%, #2d0a12 55%);
  border-color:rgba(184,148,61,0.6);
}

/* ═══════════ TYPOGRAPHY ═══════════ */
.t-xl {
  font-family:var(--serif); font-size:clamp(2.2rem,5.5vw,3.6rem);
  font-weight:900; line-height:1.15; text-align:center;
  letter-spacing:2px; color:var(--ink);
  text-shadow:1px 1px 0 rgba(184,148,61,0.2);
}
.t-lg {
  font-family:var(--serif); font-size:clamp(1.5rem,3.5vw,2.2rem);
  font-weight:700; line-height:1.3; text-align:center;
  color:var(--ink);
}
.t-md { font-family:var(--serif); font-size:1.2rem; font-weight:700; color:var(--ink); }
.t-sm { font-family:var(--serif); font-size:1rem; font-weight:700; color:var(--ink-soft); }
.t-body { font-size:0.95rem; line-height:1.9; color:var(--ink); }
.t-cap {
  font-family:var(--serif); font-size:0.72rem; color:var(--gold);
  text-align:center; letter-spacing:4px; text-transform:uppercase;
}
.t-hint {
  font-size:0.72rem; color:var(--accent); text-align:center;
  font-style:italic;
}

/* ═══════════ RED DIVIDER ═══════════ */
.gold-rule {
  display:flex; align-items:center; justify-content:center; gap:8px;
  margin:12px auto; width:100%; max-width:280px;
}
.gold-rule::before, .gold-rule::after {
  content:''; flex:1; height:1px;
  background:linear-gradient(90deg, transparent, var(--red), transparent);
}
.gold-rule span { font-size:8px; color:var(--red); }
.gold-rule.l { margin-left:0; justify-content:flex-start; }
.gold-div {
  width:100%; height:1px; margin:16px 0;
  background:linear-gradient(90deg, transparent, var(--red-dark), var(--red), var(--red-dark), transparent);
}

/* ═══════════ WAX SEAL — RED ═══════════ */
.seal {
  width:50px; height:50px; border-radius:50%; margin:0 auto;
  background:radial-gradient(circle at 38% 35%, #e8304a, #8b1530);
  box-shadow:0 3px 12px rgba(0,0,0,0.5), 0 0 0 2px rgba(196,30,58,0.4);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; color:rgba(255,255,255,0.6);
  position:relative;
}
.seal::after { content:'♜'; }
.seal.lg { width:70px; height:70px; font-size:24px; }

/* ═══════════ CARDS — DARK + RED ACCENT ═══════════ */
.card {
  background:var(--bg-card);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:0; padding:16px; margin:10px 0; position:relative;
  box-shadow:none; transition:all 0.3s;
}
.card::before { display:none; }
.card:active { transform:translateY(2px); border-color:var(--red); }
.card-wine {
  background:var(--bg-card);
  border-left:3px solid var(--red);
  color:var(--white);
}
.card-wine .t-body { color:var(--gray-light); }
.card-neut {
  background:var(--bg-card);
  color:var(--white);
  border-left:3px solid var(--gray);
}
.card-neut .t-body { color:var(--gray-light); }
.card-fold { display:none; }
.card-left-red { border-left:3px solid var(--red); }

/* ═══════════ TAGS ═══════════ */
.tag {
  display:inline-block; padding:3px 14px; font-size:0.7rem;
  font-family:var(--serif); letter-spacing:1px; border-radius:0;
  font-weight:700;
}
.tag-g { background:var(--white); color:var(--bg); }
.tag-d { background:var(--red); color:var(--white); }
.tag-n { background:var(--gray); color:var(--white); }
.stars { color:var(--red); font-size:0.8rem; letter-spacing:3px; }

/* ═══════════ BUTTONS ═══════════ */
.btn {
  display:inline-block; padding:10px 24px; border:1px solid var(--red);
  font-family:var(--serif); font-size:0.85rem; cursor:pointer;
  text-align:center; transition:all 0.25s; border-radius:0;
  letter-spacing:1px; position:relative; color:var(--white); background:transparent;
}
.btn:active { transform:translateY(2px); background:var(--red); color:var(--white); }
.btn-cream { background:transparent; color:var(--white); }
.btn-wine  { background:var(--red); color:var(--white); }
.btn-sm { padding:6px 14px; font-size:0.72rem; }

/* ═══════════ SPLIT LAYOUT ═══════════ */
.split { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.split-col { padding:16px; border:1px solid rgba(255,255,255,0.08); border-radius:0; }
.split-col.l { background:rgba(255,255,255,0.03); }
.split-col.r { background:rgba(255,255,255,0.03); }

/* ═══════════ TIMELINE ═══════════ */
.tl { position:relative; padding-left:32px; }
.tl::before {
  content:''; position:absolute; left:12px; top:0; bottom:0; width:2px;
  background:linear-gradient(180deg, var(--red-dark), var(--red), var(--red-dark));
}
.tl-node {
  position:relative; margin-bottom:18px; padding:12px 16px;
  background:var(--bg-card); border:1px solid rgba(255,255,255,0.06);
  border-radius:0; transition:all 0.3s;
}
.tl-node:active { border-color:var(--red); }
.tl-node::before {
  content:''; position:absolute; left:-24px; top:16px;
  width:9px; height:9px; border:2px solid var(--red);
  border-radius:50%; background:var(--bg);
}

/* ═══════════ SWIPER ═══════════ */
.swiper {
  display:flex; overflow-x:auto; scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch; gap:10px; padding:8px 0;
  scrollbar-width:none;
}
.swiper::-webkit-scrollbar { display:none; }
.swiper-card { flex:0 0 86%; scroll-snap-align:center; min-width:260px; }

/* ═══════════ CHARACTER AVATAR ═══════════ */
.c-av {
  width:110px; height:110px; border-radius:50%; border:3px solid var(--red);
  display:flex; align-items:center; justify-content:center;
  font-size:3rem; margin:0 auto 10px;
  box-shadow:0 4px 20px rgba(0,0,0,0.4);
  background:rgba(255,255,255,0.06);
}
.c-av.goose { background:rgba(255,255,255,0.08); }
.c-av.duck { background:rgba(255,255,255,0.06); }
.c-av.neut { background:rgba(255,255,255,0.07); }

/* ═══════════ QUICK REF GRID ═══════════ */
.qgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(100px,1fr)); gap:6px; }
.qcard {
  padding:10px 4px; text-align:center; cursor:pointer;
  border:1px solid rgba(255,255,255,0.06); border-radius:0;
  transition:all 0.3s; background:var(--bg-card); color:var(--white);
}
.qcard:active { transform:scale(0.95); border-color:var(--red); }
.qcard.goose { background:var(--bg-card); border-left:3px solid var(--red); }
.qcard.duck { background:var(--bg-card); border-left:3px solid var(--red-dark); }
.qcard.neut { background:var(--bg-card); border-left:3px solid var(--gray); }

/* ═══════════ ANIMATIONS ═══════════ */
@keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
@keyframes reveal { from { opacity:0; clip-path:inset(0 0 0 100%); } to { opacity:1; clip-path:inset(0 0 0 0); } }
@keyframes pulse { 0%,100% { opacity:0.4; } 50% { opacity:1; } }
@keyframes goldShimmer {
  0% { border-color:var(--gold); box-shadow:0 0 0 rgba(184,148,61,0); }
  50% { border-color:var(--gold-light); box-shadow:0 0 15px rgba(184,148,61,0.3); }
  100% { border-color:var(--gold); box-shadow:0 0 0 rgba(184,148,61,0); }
}
.a-fade { animation:fadeUp 0.8s ease forwards; opacity:0; }
.a-d1 { animation-delay:0.12s; } .a-d2 { animation-delay:0.3s; }
.a-d3 { animation-delay:0.5s; } .a-d4 { animation-delay:0.7s; }

/* ═══════════ BOTTOM DECORATION ═══════════ */
.bot-dec {
  width:100%; height:12px; margin-top:16px;
  background:repeating-linear-gradient(90deg, transparent, transparent 4px, rgba(196,30,58,0.4) 4px, rgba(196,30,58,0.4) 5px);
}

/* ═══════════ HIGHLIGHT ═══════════ */
.hl { background:linear-gradient(180deg, transparent 55%, rgba(196,30,58,0.25) 55%); }
.hl-r { background:linear-gradient(180deg, transparent 55%, rgba(200,40,40,0.2) 55%); }

/* ═══════════ PAGE INDICATOR ═══════════ */
.pg-ind {
  position:fixed; bottom:12px; right:12px; z-index:100;
  font-family:var(--serif); font-size:0.68rem; color:var(--red);
  background:rgba(0,0,0,0.7); padding:4px 12px; border-radius:12px;
  border:0.5px solid rgba(196,30,58,0.4); pointer-events:none;
}

/* ═══════════ SCROLL HINT ═══════════ */
.scroll-hint {
  text-align:center; padding:6px;
  animation:pulse 2.5s infinite;
  font-size:0.72rem; color:var(--red);
  font-style:italic;
}
</style>
</head>

function charCard(c,idx,total){
  const isG=c.faction==='鹅阵营',isD=c.faction==='鸭阵营';
  const avCls=isG?'goose':(isD?'duck':'neut');
  const cardCls=isD?'card-wine':(!isG?'card-neut':'');
  const tagCls=isG?'tag-g':(isD?'tag-d':'tag-n');
  const tCol='color:#000;';
  const bCol='color:#111;';
  const avatarHtml = c.icon

    : `<div class="c-av ${avCls}">${c.emoji}</div>`;
  return `<div class="swiper-card"><div class="card ${cardCls}" style="min-height:380px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 16px;">
    <div class="card-fold"></div>

    <p class="t-body" style="font-size:0.82rem;margin:4px 0;${bCol}"><b>技能：</b>${c.skill}</p>
    <p class="t-body" style="font-size:0.82rem;margin:4px 0;${bCol}"><b>玩法：</b>${c.play}</p>
    <div style="margin-top:12px;padding:8px 12px;border-top:1px solid var(--gold-pale);width:100%;">
      <p style="font-size:0.72rem;color:var(--gold);font-style:italic;">📝 ${c.tip}</p></div>
    <span style="font-size:0.65rem;color:var(--gold);margin-top:8px;">${idx+1}/${total} ← 横滑 →</span>

}

// ═══════════════════ APP LOGIC ═══════════════════
let cur=1, curFac='goose', tY=0, tX=0, total=20, navLock=false;

function init(){
  let h='';
  h+=P1();h+=P2();h+=P3();h+=P4();h+=P5();h+=P6();h+=P7();h+=P8();
  for(let i=9;i<=13;i++)h+=PChar(i);
  h+=P14();h+=P15();h+=P16();h+=P17();h+=P18();h+=P19();h+=P20();
  document.getElementById('app').innerHTML=h;

  document.querySelectorAll('.page').forEach((p,i)=>{
    p.className=i===0?'page active':'page after';
  });

  populateChars();populateQuickRef();updateP8('goose');updateIndicator();

  requestAnimationFrame(()=>{
    document.querySelectorAll('#p1 .a-fade').forEach(el=>el.style.opacity='');
  });

  bindLongPress('p2left','rgba(255,255,255,0.9)','0 0 30px rgba(255,255,255,0.7)');
  bindLongPress('p2right','rgba(61,15,26,0.5)','0 0 30px rgba(200,30,30,0.35)');
}

function bindLongPress(id,bg,sh){
  const el=document.getElementById(id);if(!el)return;
  ['mousedown','touchstart'].forEach(ev=>el.addEventListener(ev,e=>{
    if(ev.type==='touchstart')e.preventDefault();
    el.style.background=bg;el.style.boxShadow=sh;
  }));
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>el.addEventListener(ev,()=>{
    el.style.background='';el.style.boxShadow='';
  }));
}

function populateChars(){
  renderCharGroup(9,CHARS.goose.slice(0,3),'鹅阵营合集详情页',false);
  renderCharGroup(10,CHARS.goose.slice(3,8),'鹅阵营剩余角色详情页',false);
  renderCharGroup(11,CHARS.duck.slice(0,2),'鸭阵营刺杀组详情页',true);
  renderCharGroup(12,CHARS.duck.slice(2,7),'鸭阵营功能组详情页',true);
  renderCharGroup(13,CHARS.neutral,'全中立角色详情页',false);
}

function renderCharGroup(pgNum,chars,title,isDuck){
  const c=document.getElementById(`p${pgNum}Content`);if(!c)return;
  const titleCol=isDuck?'color:#000;':'color:var(--ink);';
  c.innerHTML=`
    <button class="btn btn-cream btn-sm" onclick="navigateTo(8)" style="margin-bottom:8px;">← 返回目录</button>
    <h2 class="t-lg" style="${titleCol}">${title}</h2>${rule()}
    <div class="swiper" id="swP${pgNum}">${chars.map((ch,i)=>charCard(ch,i,chars.length)).join('')}</div>`;
}

function populateQuickRef(){
  const g=document.getElementById('quickGrid');if(!g)return;
  const all=[
    ...CHARS.goose.map(c=>({...c,color:'goose',pg:CHARS.goose.indexOf(c)<3?9:10})),
    ...CHARS.duck.map(c=>({...c,color:'duck',pg:CHARS.duck.indexOf(c)<2?11:12})),
    ...CHARS.neutral.map(c=>({...c,color:'neut',pg:13}))
  ];
  g.innerHTML=all.map(c=>{
    const avHtml = c.icon
      ? `<img src="${c.icon}" style="width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;" onerror="this.outerHTML='<span style=font-size:1.8rem;>${c.emoji}</span>'">`
      : `<div style="font-size:1.8rem;">${c.emoji}</div>`;
    return`<div class="qcard ${c.color}" onclick="navChar('${c.id}')">${avHtml}<p style="font-size:0.72rem;font-weight:700;">${c.name}</p><p style="font-size:0.62rem;opacity:0.7;">${c.role}</p></div>`;
  }).join('');
}

function updateP8(faction){
  curFac=faction;
  const list=document.getElementById('p8List'),title=document.getElementById('p8Title'),pg=document.getElementById('p8');
  if(!list||!title||!pg)return;
  let chars,label;
  if(faction==='goose'){chars=CHARS.goose;label='鹅阵营 · 好人';}
  else if(faction==='duck'){chars=CHARS.duck;label='鸭阵营 · 坏人';}
  else{chars=CHARS.neutral;label='中立阵营 · 独行';}
  const inner=pg.querySelector('.pg');
  if(inner){
    if(faction==='duck'){inner.style.background='linear-gradient(180deg, #3d0f1a 0%, #2d0a12 40%, #20080e 100%), repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,0.015) 3px, rgba(255,255,255,0.015) 4px)';inner.style.color='#000';}
    else{inner.style.background='';inner.style.color='';}
  }
  title.textContent=`角色目录 · ${label}`;
  title.style.color='#000';
  const isD=faction==='duck',isN=faction==='neutral';
  list.innerHTML=chars.map((c,i)=>{
    const tPg=faction==='goose'?(i<3?9:10):(faction==='duck'?(i<2?11:12):13);
    const cardCls=isD?'card-wine':(isN?'card-neut':'');
    const tCol='color:#000;';
    const subCol='color:#444;';
    const avatarHtml = c.icon
      ? `<img src="${c.icon}" style="width:36px;height:36px;border-radius:50%;border:1px solid var(--gold);object-fit:cover;" onerror="this.outerHTML='<span style=font-size:1.8rem;>${c.emoji}</span>'">`
      : `<span style="font-size:1.8rem;">${c.emoji}</span>`;
    return`<div class="card ${cardCls}" onclick="navCharPage(${tPg},${i},'${faction}')" style="cursor:pointer;margin:6px 0;">
      <div class="card-fold"></div><div style="display:flex;align-items:center;gap:10px;">
      ${avatarHtml}
      <div style="flex:1;"><h4 style="font-family:var(--serif);${tCol}">${c.name}</h4><div class="stars">${c.stars}</div><p style="font-size:0.7rem;${subCol}">${c.role}</p></div>
      <span style="font-size:0.6rem;color:var(--gold);border:0.5px solid var(--gold);padding:2px 8px;border-radius:8px;">详情 →</span></div></div>`;
  }).join('');
}

function navigateTo(pg,faction){
  if(navLock||pg<1||pg>total||pg===cur)return;
  navLock=true;
  const oldPg=document.getElementById(`p${cur}`),newPg=document.getElementById(`p${pg}`);
  if(!oldPg||!newPg){navLock=false;return;}
  const goingForward=pg>cur;
  oldPg.className=goingForward?'page before':'page after';
  document.querySelectorAll('.page').forEach(p=>{
    const n=parseInt(p.dataset.pg);
    if(n===pg||n===cur)return;
    p.className=n<pg?'page before':'page after';
  });
  newPg.className='page active';newPg.scrollTop=0;cur=pg;
  if(pg===8&&faction)updateP8(faction);
  updateIndicator();
  requestAnimationFrame(()=>{newPg.querySelectorAll('.a-fade').forEach(el=>el.style.opacity='');});
  setTimeout(()=>{navLock=false;},600);
}

function navCharPage(pg,idx,faction){
  navigateTo(pg);
  setTimeout(()=>{
    const sw=document.getElementById(`swP${pg}`);
    if(sw){const card=sw.querySelector('.swiper-card');if(card)sw.scrollLeft=idx*(card.clientWidth+10);}
  },650);
}

function navChar(id){
  for(let i=0;i<CHARS.goose.length;i++){if(CHARS.goose[i].id===id){navCharPage(i<3?9:10,i<3?i:i-3,'goose');return;}}
  for(let i=0;i<CHARS.duck.length;i++){if(CHARS.duck[i].id===id){navCharPage(i<2?11:12,i<2?i:i-2,'duck');return;}}
  for(let i=0;i<CHARS.neutral.length;i++){if(CHARS.neutral[i].id===id){navCharPage(13,i,'neutral');return;}}
}

function resetAll(){
  cur=1;
  document.querySelectorAll('.page').forEach((p,i)=>{p.className=i===0?'page active':'page after';p.scrollTop=0;});
  const inner=document.querySelector('#p8 .pg');if(inner){inner.style.background='';inner.style.color='';}
  updateIndicator();
}

function updateIndicator(){document.getElementById('pgNum').textContent=`${cur} / ${total}`;}

// ═══════════════ INPUT HANDLERS ═══════════════
let wheelAccum=0,wheelTimer=null;

document.addEventListener('touchstart',e=>{tY=e.touches[0].clientY;tX=e.touches[0].clientX;},{passive:true});

document.addEventListener('touchend',e=>{
  if(navLock)return;
  const dy=tY-e.changedTouches[0].clientY,dx=tX-e.changedTouches[0].clientX;
  if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>50){
    const pg=document.getElementById(`p${cur}`);
    if(pg){
      const atTop=pg.scrollTop<=0,atBottom=pg.scrollTop+pg.clientHeight>=pg.scrollHeight-5;
      if(dy>0&&cur<total&&atBottom)navigateTo(cur+1);
      else if(dy<0&&cur>1&&atTop)navigateTo(cur-1);
    }
  }
});

document.addEventListener('click',e=>{
  if(e.target.closest('button')||e.target.closest('[onclick]')||e.target.closest('.card')||e.target.closest('.qcard'))return;
  if(cur===1&&!navLock)navigateTo(2);
});

// Keyboard — fixed: listen on document with proper focus handling
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key==='PageDown'){
    e.preventDefault();
    if(!navLock&&cur<total){
      const pg=document.getElementById(`p${cur}`);
      const atBottom=pg&&pg.scrollTop+pg.clientHeight>=pg.scrollHeight-5;
      if(atBottom||!pg||pg.scrollHeight<=pg.clientHeight+10)navigateTo(cur+1);
    }
  }else if(e.key==='ArrowUp'||e.key==='ArrowLeft'||e.key==='PageUp'){
    e.preventDefault();
    if(!navLock&&cur>1){
      const pg=document.getElementById(`p${cur}`);
      const atTop=pg&&pg.scrollTop<=0;
      if(atTop||!pg)navigateTo(cur-1);
    }
  }
});

document.addEventListener('wheel',e=>{
  const pg=document.getElementById(`p${cur}`);if(!pg||navLock)return;
  const atTop=pg.scrollTop<=0,atBottom=pg.scrollTop+pg.clientHeight>=pg.scrollHeight-5;
  if((e.deltaY>0&&!atBottom)||(e.deltaY<0&&!atTop)){wheelAccum=0;return;}
  wheelAccum+=e.deltaY;
  if(Math.abs(wheelAccum)>80){
    if(wheelAccum>0&&cur<total&&atBottom){navigateTo(cur+1);wheelAccum=0;}
    else if(wheelAccum<0&&cur>1&&atTop){navigateTo(cur-1);wheelAccum=0;}
    else{wheelAccum=0;}
  }
  clearTimeout(wheelTimer);wheelTimer=setTimeout(()=>{wheelAccum=0;},400);
},{passive:true});

// Make sure key events work — add tabindex to body so it can receive focus
document.body.setAttribute('tabindex','0');
document.body.focus();
document.body.addEventListener('click',function(){this.focus();});
